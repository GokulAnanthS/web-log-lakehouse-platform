version: 2

sources:
  - name: gold
    database: SNOWFLAKE_DEV
    schema: RAW
    tables:
      - name: TRAFFIC_DAILY
        description: "Daily aggregated traffic metrics from Gold layer"
      - name: TRAFFIC_HOURLY
